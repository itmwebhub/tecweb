<html>
      <head>
        <body>
            <script languaje="javascript">
                var contador=0;

            function incrementar()
            {
                contador++;
                alert('El contador ahora vale :' + contador);
            }
            function decrementar()
            {
                contador--;
                alert('El contador ahora vale :' + contador);
            }
            </script>
            <form>
                <input type="button" onClick="incrementar()"
                value="incrementar">
                 <input type="button" onClick="decrementar()"
                value="decrementar">

            </form>
        </body>
      </head>
</html>
